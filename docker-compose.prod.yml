services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: daijo-mes-app:latest
        container_name: daijo-mes-app
        restart: unless-stopped
        env_file: .env
        volumes:
            - storage-data:/var/www/html/storage
            - public-data:/var/www/html/public-shared
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - daijo-net

    web:
        image: nginx:alpine
        container_name: daijo-mes-web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - public-data:/var/www/html/public:ro
            - storage-data:/var/www/html/storage:ro
            - ./docker/production/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - daijo-net

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        image: daijo-mes-app:latest
        container_name: daijo-mes-queue
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        env_file: .env
        volumes:
            - storage-data:/var/www/html/storage
        depends_on:
            - app
            - redis
        networks:
            - daijo-net

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        image: daijo-mes-app:latest
        container_name: daijo-mes-scheduler
        restart: unless-stopped
        command: php artisan schedule:work
        env_file: .env
        volumes:
            - storage-data:/var/www/html/storage
        depends_on:
            - app
            - mysql
        networks:
            - daijo-net

    redis:
        image: redis:alpine
        container_name: daijo-mes-redis
        restart: unless-stopped
        command: >
            sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
                exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes;
            else
                exec redis-server --appendonly yes;
            fi"
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
        volumes:
            - redis-data:/data
        networks:
            - daijo-net

    mysql:
        image: mysql:8.0
        container_name: daijo-mes-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-DAIJO_MES}"
            MYSQL_USER: "${DB_USERNAME:-sail}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - daijo-net
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-sail}", "-p${DB_PASSWORD:-password}"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    daijo-net:
        driver: bridge

volumes:
    storage-data:
        driver: local
    public-data:
        driver: local
    redis-data:
        driver: local
    mysql-data:
        driver: local
